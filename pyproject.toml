[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kata-desktop-mate"
dynamic = ["version"]
description = "Kata the fox: a pixel-art desktop mate for Windows."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    # The core Qt modules only (QtCore, QtGui, QtWidgets). Still imported as "PySide6".
    "PySide6-Essentials>=6.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "pillow>=10",   # only tools/make_sprites.py needs it
    "hypothesis>=6.170",
    "coverage>=7.17",
    "mypy>=2.4",
    "cosmic-ray>=8.9",
]

[project.gui-scripts]
kata = "kata.__main__:main"

[tool.setuptools.dynamic]
# The one copy of the version is kata.__version__; the package metadata is read from it.
version = { attr = "kata.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kata = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["kata"]

[tool.coverage.report]
# The gate: the no-Qt modules, and only those. tests/test_no_qt.py fails if this list and what
# the modules really import disagree. The Qt modules are checked by hand instead (CLAUDE.md).
include = ["*/kata/animator.py", "*/kata/sheet.py"]
fail_under = 90
show_missing = true

[tool.mypy]
strict = true
files = ["src", "tests", "tools"]
# Find kata in src/ directly: mypy may not follow the editable install's import hook.
mypy_path = "src"

[tool.ruff]
line-length = 110
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
